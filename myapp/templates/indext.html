<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딥페이크 이미지 탐지 | HOLMEZ</title>
    <!-- ✅ Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 font-sans text-green-900">

    <!-- ✅ 헤더 -->
    <header class="flex justify-between items-center px-8 py-4 bg-white shadow">
        <h1 class="text-2xl font-bold text-green-700">HOLMEZ</h1>
        <nav class="space-x-6 text-lg">
            <a href="/" class="hover:text-green-500">홈</a>
            <a href="/image" class="hover:text-green-500">이미지 탐지</a>
            <a href="/extension" class="hover:text-green-500">크롬 확장</a>
            <a href="/login" class="hover:text-green-500">로그인</a>
        </nav>
    </header>

    <!-- ✅ 메인 콘텐츠 -->
    <main class="flex flex-col items-center text-center mt-16 px-4">
        <h2 class="text-4xl font-extrabold mb-4">AI 기반 딥페이크 이미지 탐지</h2>
        <p class="text-lg text-gray-700 mb-8">이미지 업로드 후 <span class="text-green-700 font-bold">1초 만에</span> 결과 확인하세요!</p>
        
        <!-- ✅ 업로드 박스 -->
        <form action="/upload" method="POST" enctype="multipart/form-data" class="bg-white shadow rounded-lg p-6 w-full max-w-md">
            <label for="image" class="block text-gray-700 mb-2 font-medium">이미지 선택</label>
            <input type="file" name="image" id="image" accept=".jpg,.jpeg,.png"
                class="w-full border rounded px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-500">
            
            <button type="submit"
                class="w-full bg-green-600 text-white font-bold py-3 rounded hover:bg-green-700 transition">
                분석 시작하기
            </button>
        </form>

        <!-- ✅ 서비스 특징 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-10 w-full max-w-3xl">
            <div class="bg-white rounded-lg shadow p-4">
                <p class="text-3xl font-bold text-green-600">99%</p>
                <p class="text-gray-700">정확도</p>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <p class="text-3xl font-bold text-green-600">&lt;1초</p>
                <p class="text-gray-700">분석 속도</p>
            </div>
            <div class="bg-white rounded-lg shadow p-4">
                <p class="text-3xl font-bold text-green-600">보안</p>
                <p class="text-gray-700">데이터 보호</p>
            </div>
        </div>
    </main>

</body>
</html>
